apiVersion: v1
kind: Secret
metadata:
  name: fru-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  # Database password (from Terraform Secrets Manager or .env)
  db-password: "${PGPASSWORD}"
  
  # AWS credentials (for Bedrock access)
  # These should be the bedrock-admin credentials from .env
  aws-access-key-id: "${AWS_ACCESS_KEY_ID}"
  aws-secret-access-key: "${AWS_SECRET_ACCESS_KEY}"
  
  # OpenAI API key (from Terraform Secrets Manager or .env)
  openai-api-key: "${OPENAI_API_KEY}"

