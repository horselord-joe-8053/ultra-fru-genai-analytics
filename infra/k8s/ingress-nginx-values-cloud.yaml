# NGINX Ingress Controller Helm values for cloud providers (EKS/GKE/AKS)
# Uses LoadBalancer service type and schedules on ingress node group

controller:
  service:
    type: LoadBalancer  # Cloud creates LB automatically
    annotations:
      # Use an internet-facing Network Load Balancer with IP targets.
      # Subnet selection is driven by standard Kubernetes subnet tags:
      #   - Public:  kubernetes.io/role/elb=1
      #   - Private: kubernetes.io/role/internal-elb=1
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  ingressClassResource:
    name: nginx
  nodeSelector:
    role: ingress  # Schedule only on ingress node group
  tolerations:
    - key: ingress-only
      operator: Equal
      value: "true"
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

