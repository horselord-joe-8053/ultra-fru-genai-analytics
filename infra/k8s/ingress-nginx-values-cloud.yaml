# NGINX Ingress Controller Helm values for cloud providers (EKS/GKE/AKS)
# Uses LoadBalancer service type and schedules on ingress node group

controller:
  service:
    type: LoadBalancer  # Cloud creates LB automatically
    annotations:
      # Exclude from AWS Load Balancer Controller (use native EKS service controller)
      # The AWS Load Balancer Controller should NOT manage this service
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      # CRITICAL: Specify public subnets for internet-facing LoadBalancer
      # Without this, NLB is created in private subnets (where nodes are) and cannot receive internet traffic
      service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0fabe97167898925e,subnet-0ec041ddd165738c4"
      # Ensure EKS service controller handles this (not AWS Load Balancer Controller)
      # Remove any annotations that might trigger AWS Load Balancer Controller
  ingressClassResource:
    name: nginx
  nodeSelector:
    role: ingress  # Schedule only on ingress node group
  tolerations:
    - key: ingress-only
      operator: Equal
      value: "true"
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

